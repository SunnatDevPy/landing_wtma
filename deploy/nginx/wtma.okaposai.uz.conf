# wtma.okaposai.uz — host nginx (Finance panel, Certbot SSL)
# Joylash: /etc/nginx/sites-available/wtma.okaposai.uz
# Caddy o'rniga ishlatiladi (faqat bitta dastur 80/443 portni ishlatishi mumkin)

server {
    listen 80;
    listen [::]:80;
    server_name wtma.okaposai.uz;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
