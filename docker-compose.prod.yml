# Production — landing.okaposai.uz
# Variant A: Caddy orqali (wtma tarmog'i)
# Variant B: Host nginx + Certbot (127.0.0.1:8082) — setup-nginx-certbot.sh

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: wtma-landing-web
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - wtma

networks:
  wtma:
    external: true
    name: ${DOCKER_NETWORK:-wtma}
