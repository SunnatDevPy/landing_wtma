# Production — landing.okaposai.uz
# Serverda: docker compose -f docker-compose.prod.yml up -d --build
#
# Finance loyihasidagi Caddy allaqachon 80/443 portlarni band qilgan.
# Bu compose faqat ichki nginx konteynerini ishga tushiradi; Caddy
# `wtma` tarmog'i orqali `wtma-landing-web:80` ga yo'naltiradi.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: wtma-landing-web
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - wtma

networks:
  wtma:
    external: true
    name: ${DOCKER_NETWORK:-wtma}
